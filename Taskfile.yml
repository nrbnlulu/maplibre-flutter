version: "3"

vars:
    DART_BIN: "rlutter dart"

tasks:
    # --- Rust tasks ---
    rust.fmt:
        desc: Format Rust code
        dir: rust
        cmds:
            - cargo fmt

    rust.fmt-check:
        desc: Check Rust code formatting
        dir: rust
        cmds:
            - cargo fmt -- --check

    rust.lint:
        desc: Lint Rust code
        dir: rust
        cmds:
            - cargo clippy -- -D warnings

    rust.check:
        desc: Check Rust compilation
        dir: rust
        cmds:
            - cargo check

    mln-core:
        desc: Cache a prebuilt MapLibre Native core so builds skip the C++ compile
        cmds:
            - ./tool/setup-mln-core.sh

    rust.test:
        desc: Run Rust tests
        dir: rust
        cmds:
            - cargo test

    rust.fix:
        desc: Fix Rust code issues where possible
        dir: rust
        cmds:
            - cargo clippy --fix --allow-dirty --allow-staged

    # --- Dart/Flutter tasks ---
    flutter.fmt:
        desc: Format Dart code
        cmds:
            - "{{.DART_BIN}} format lib example"

    flutter.fmt-check:
        desc: Check Dart code formatting
        cmds:
            - "{{.DART_BIN}} format --set-exit-if-changed ."

    flutter.lint:
        desc: Run Flutter analyzer
        cmds:
            - "{{.DART_BIN}} analyze lib example/lib"

    flutter.fix:
        desc: Fix all Dart code issues and format
        cmds:
            - "{{.DART_BIN}} fix --apply"
            - "{{.DART_BIN}} format ."

    flutter.test:
        desc: Run Flutter tests
        cmds:
            - "{{.DART_BIN}} test"

    flutter.get:
        desc: Get Flutter dependencies
        cmds:
            - "{{.DART_BIN}} pub get"

    codegen:
        desc: Generate standalone MapLibre FRB bindings and Dart models
        cmds:
            - sh tool/codegen.sh
            - rlutter dart run build_runner build
            - rlutter dart format lib/src/rust

    run:
        desc: Run the standalone example using the cached native core
        dir: example
        env:
            MLN_PRECOMPILE: "1"
            MLN_CORE_LIBRARY_USE_AMALGAM: "0"
            MLN_CORE_LIBRARY_PATH: '{{.ROOT_DIR}}/.cache/mln-core/libmbgl-core.a'
            MLN_CORE_LIBRARY_HEADERS_PATH: '{{.ROOT_DIR}}/.cache/mln-core/maplibre-native-headers.tar.gz'
            MLN_WEBGPU_CPP_INCLUDE_DIR: '{{.ROOT_DIR}}/.cache/mln-core/webgpu-cpp'
            MLN_CORE_SRC_INCLUDE_DIR: '{{.ROOT_DIR}}/.cache/mln-core/src'
        cmds:
            - rlutter run --device linux {{.CLI_ARGS}}

    # --- Combined tasks ---
    fix:
        desc: Fix both Rust and Flutter code issues
        deps:
            - task: rust.fix
            - task: flutter.fix

    fmt:
        desc: Format both Rust and Flutter code
        deps:
            - task: rust.fmt
            - task: flutter.fmt

    lint:
        desc: Lint both Rust and Flutter code
        deps:
            - task: rust.lint
            - task: flutter.lint

    check:
        desc: Check both Rust and Flutter code
        deps:
            - task: rust.check
            - task: flutter.lint

    test:
        desc: Run tests for both Rust and Flutter
        deps:
            - task: rust.test
            - task: flutter.test

    all:
        desc: Run format, lint, and test for both Rust and Flutter
        deps:
            - task: fmt
            - task: lint
            - task: test
